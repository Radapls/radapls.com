<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 280" role="img" aria-labelledby="title desc">
  <title id="title">Misión de Observación Electoral</title>
  <desc id="desc">The red MOE emblem appears first, the yellow arc sweeps from left to right, and the view zooms out to reveal the complete wordmark.</desc>
  <defs>
    <clipPath id="yellow-wipe" clipPathUnits="userSpaceOnUse">
      <rect class="wipe-rect" x="0" y="0" width="0" height="280" />
    </clipPath>
  </defs>
  <style>
    .full-logo {
      opacity: 0;
      animation: logo-cycle 20s linear infinite;
    }
    .logo-zoom {
      transform-box: view-box;
      transform-origin: 53.6% 52%;
      animation: zoom-out 20s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .moe-circle {
      transform-box: view-box;
      transform-origin: 53.6% 52%;
      animation: circle-appear 20s ease-out infinite;
    }
    .moe-letters {
      opacity: 0;
      animation: letters-appear 20s ease-out infinite;
    }
    .moe-yellow {
      clip-path: url(#yellow-wipe);
    }
    .wipe-rect {
      animation: yellow-sweep 20s linear infinite;
    }
    @keyframes logo-cycle {
      0% { opacity: 0; }
      3% { opacity: 1; }
      95% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes circle-appear {
      0% { opacity: 0; transform: scale(.88); }
      6% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes yellow-sweep {
      0%, 6% { width: 0; }
      17% { width: 784px; }
      95% { width: 784px; }
      100% { width: 0; }
    }
    @keyframes zoom-out {
      0%, 17% { transform: translateY(8px) scale(1.3); }
      27% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes letters-appear {
      0%, 17% { opacity: 0; }
      27% { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .full-logo, .logo-zoom, .moe-circle, .moe-letters, .wipe-rect { animation: none; }
      .full-logo, .moe-circle, .moe-letters { opacity: 1; transform: none; }
      .wipe-rect { width: 784px; }
    }
  </style>
